# gRouter Complete Configuration
# This file serves as a reference for all available configuration options.

app:
  name: "natsdemosvc"
  version: "1.0.0"
  environment: "development" # development, production, test

# Logging Configuration
log:
  level: "debug"   # debug, info, warn, error, dpanic, panic, fatal
  format: "console" # console, json
  output_path: "stdout" # stdout, stderr, or file path

# Service Manager Configuration
manager:
  shutdown_timeout: "30s"
  monitor_interval: "5s"

# Web Server Configuration
web:
  enabled: true
  port: 8080
  mode: "debug" # debug, release, test
  read_timeout: "10s"
  write_timeout: "10s"
  shutdown_timeout: "5s"
  max_request_body_size: 10485760 # 10MB

  # Web Logging
  logging:
    enabled: true

  # Web Authentication (JWT)
  auth:
    enabled: false
    issuer: ""
    audience: ""

  # Web-specific Metrics Override (optional, defaults to global provided by middleware)
  metrics:
    enabled: true
    path: "/metrics"

  # TLS Configuration
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

  # CORS (Cross-Origin Resource Sharing)
  cors:
    enabled: true
    allowed_origins: 
      - "*"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed_headers:
      - "Origin"
      - "Content-Type"
      - "Authorization"
      - "Accept"
    exposed_headers:
      - "Content-Length"
    allow_credentials: true
    max_age: 43200 # 12 hours in seconds

  # Security Headers
  security:
    enabled: false
    xss_protection: "1; mode=block"
    content_type_nosniff: "nosniff"
    x_frame_options: "DENY"
    hsts_max_age: 31536000 # 1 year
    hsts_exclude_subdomains: false
    content_security_policy: "default-src 'self'"
    referrer_policy: "strict-origin-when-cross-origin"
    custom_headers:
      X-Powered-By: "gRouter"

  # Rate Limiting
  rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 200

  # Swagger API Documentation
  swagger:
    enabled: true
    path: "/swagger"

# gRPC Configuration
grpc:
  enabled: true
  port: 9090
  keepalive_time: "2h"
  keepalive_timeout: "20s"
  reflection_enabled: true
  gateway_enabled: true
  gateway_port: 8081
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""
    skip_verify: false

# NATS Messaging Configuration
nats:
  enabled: true
  url: "nats://localhost:4222"
  max_reconnects: 5
  reconnect_wait: "2s"
  connection_timeout: "2s"
  
  # Authentication
  auth:
    enabled: true
    # token: "my-token"
    # username: "user"
    # password: "password"
    # creds_file: "/path/to/user.creds"

  # TLS/SSL
  tls:
    enabled: false
    skip_verify: false
    ca_file: ""
    cert_file: ""
    key_file: ""
  
  # Middleware Configuration (Granular Control)
  # This section allows you to independently toggle each NATS middleware component.
  middleware:
    recovery:
      enabled: true
    logging:
      enabled: true
    metrics:
      enabled: true
      path: "/metrics"
    tracing:
      enabled: true
    circuit_breaker:
      enabled: true
      max_requests: 5
      interval: "60s"
      timeout: "10s"
      trip_threshold: 5
    retry:
      enabled: true
      max_attempts: 3
      initial_interval: "100ms"
      multiplier: 2.0
      max_interval: "1s"
    timeout:
      enabled: true
      default: "5s"
    rate_limit:
      enabled: true
      requests_per_second: 100
      burst: 200

# Database Configuration (GORM)
database:
  driver: "sqlite" # postgres, sqlite, mysql, sqlserver
  
  # PostgreSQL / MySQL settings
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "password"
  dbname: "grouter"
  ssl_mode: "disable" # disable, require, verify-ca, verify-full
  
  # Logger settings
  log_level: "warn" # silent, error, warn, info
  
  # Connection Pool settings
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "1h"

# Dynamic Service Toggle
# Enable/Disable individual services loaded by the ServiceManager
services:
  natdemo:
    enabled: true
    name: "natdemo"

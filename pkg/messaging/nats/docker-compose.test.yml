version: '3.8'

services:
  nats:
    image: nats:2.10-alpine
    container_name: nats-test
    command: 
      - "-js"  # Enable JetStream
      - "-sd"
      - "/data"
      - "-m"
      - "8222"  # Monitoring port
    ports:
      - "4222:4222"  # Client connections
      - "8222:8222"  # HTTP monitoring
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  nats-data:

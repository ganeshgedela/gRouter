# REST API Service Configuration

app:
  name: "rest-api"
  version: "1.0.0"
  environment: "development"

# Logging Configuration
logging:
  level: "info"
  encoding: "json"
  output_paths:
    - "stdout"
  error_output_paths:
    - "stderr"

# Web Server Configuration
web:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  read_timeout: "15s"
  write_timeout: "15s"
  idle_timeout: "60s"
  shutdown_timeout: "30s"
  
  cors:
    enabled: true
    allow_origins: ["*"]
    allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allow_headers: ["*"]
    expose_headers: ["Content-Length"]
    allow_credentials: true
    max_age: 3600

# Service Registry Configuration
services:
  users:
    enabled: true
    cache_enabled: true
    cache_ttl: "5m"
  
  orders:
    enabled: true
    cache_enabled: true
    cache_ttl: "5m"

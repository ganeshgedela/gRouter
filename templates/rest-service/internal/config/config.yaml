# REST API Service Configuration

app:
  name: "rest-api"
  version: "1.0.0"
  environment: "development"

# Logging Configuration
logging:
  level: "info"
  encoding: "json"
  output_paths:
    - "stdout"
  error_output_paths:
    - "stderr"

# Web Server Configuration
web:
  port: 8080
  mode: "debug"                    # debug, release, test
  read_timeout: "30s"
  write_timeout: "30s"
  shutdown_timeout: "10s"
  max_multipart_memory: 8          # MB

  # TLS Configuration
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    client_auth: false
    ca_file: ""

  # CORS Configuration
  cors:
    enabled: true
    allow_origins:
      - "*"
    allow_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allow_headers:
      - "Origin"
      - "Content-Type"
      - "Authorization"
    expose_headers:
      - "Content-Length"
    allow_credentials: true
    max_age: "12h"

  # Security Configuration
  security:
    enabled: true
    frame_deny: true
    content_type_nosniff: true
    browser_xss_filter: true
    content_security_policy: "default-src 'self'"
    strict_transport_security: true
    hsts_max_age: "31536000"

  # Rate Limiting
  rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 200

  # Middleware
  logging_enabled: true
  metrics_enabled: true
  tracing_enabled: true
  recovery_enabled: true
  compression_enabled: true

# Telemetry Configuration
telemetry:
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
  
  tracing:
    enabled: true
    provider: "otlp"
    endpoint: "localhost:4317"
    sample_rate: 0.1

# Service-Specific Configuration
users:
  enabled: true
  enable_cache: true
  cache_ttl: "5m"

orders:
  enabled: true
  enable_cache: true
  cache_ttl: "10m"

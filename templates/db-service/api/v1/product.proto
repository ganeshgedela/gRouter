syntax = "proto3";

package product.v1;

option go_package = "grouter/templates/db-service/api/v1;productv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "api/v1/common.proto";

// ProductService provides CRUD operations for products
service ProductService {
  // CreateProduct creates a new product
  rpc CreateProduct(CreateProductRequest) returns (Product);
  
  // GetProduct retrieves a product by ID
  rpc GetProduct(GetProductRequest) returns (Product);
  
  // ListProducts lists products with pagination and filtering
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  
  // UpdateProduct updates an existing product
  rpc UpdateProduct(UpdateProductRequest) returns (Product);
  
  // DeleteProduct deletes a product by ID
  rpc DeleteProduct(DeleteProductRequest) returns (google.protobuf.Empty);
  
  // UpdateStock updates product stock with atomic delta operation
  rpc UpdateStock(UpdateStockRequest) returns (Product);
  
  // BulkCreateProducts creates multiple products in a single transaction (server streaming)
  rpc BulkCreateProducts(stream CreateProductRequest) returns (BulkCreateProductsResponse);
}

// Product represents a product entity
message Product {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  string sku = 5;
  int32 stock = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// CreateProductRequest is the request message for creating a product
message CreateProductRequest {
  string name = 1;
  string description = 2;
  double price = 3;
  string sku = 4;
  int32 stock = 5;
}

// GetProductRequest is the request message for retrieving a product
message GetProductRequest {
  uint64 id = 1;
}

// ListProductsRequest is the request message for listing products
message ListProductsRequest {
  common.v1.PaginationRequest pagination = 1;
}

// ListProductsResponse is the response message for listing products
message ListProductsResponse {
  repeated Product products = 1;
  common.v1.PaginationResponse pagination = 2;
}

// UpdateProductRequest is the request message for updating a product
message UpdateProductRequest {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock = 5;
}

// DeleteProductRequest is the request message for deleting a product
message DeleteProductRequest {
  uint64 id = 1;
}

// UpdateStockRequest is the request message for updating product stock
message UpdateStockRequest {
  uint64 id = 1;
  int32 stock_delta = 2; // Positive to add, negative to subtract
}

// BulkCreateProductsResponse is the response message for bulk creation
message BulkCreateProductsResponse {
  int32 created_count = 1;
  repeated Product products = 2;
}

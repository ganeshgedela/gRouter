# Hybrid Service Configuration (REST + NATS)

app:
  name: "hybrid-service"
  version: "1.0.0"
  environment: "development"

# Logging Configuration
logging:
  level: "info"
  encoding: "json"
  output_paths:
    - "stdout"
  error_output_paths:
    - "stderr"

# Web Server Configuration
web:
  port: 8080
  mode: "debug"
  read_timeout: "30s"
  write_timeout: "30s"
  shutdown_timeout: "10s"
  max_multipart_memory: 8

  # TLS Configuration
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

  # CORS Configuration
  cors:
    enabled: true
    allow_origins:
      - "*"
    allow_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
    allow_headers:
      - "Origin"
      - "Content-Type"
      - "Authorization"
    allow_credentials: true
    max_age: "12h"

  # Middleware
  logging_enabled: true
  metrics_enabled: true
  tracing_enabled: true
  recovery_enabled: true

# NATS Configuration
nats:
  url: "nats://localhost:4222"
  max_reconnects: 10
  reconnect_wait: "2s"
  connection_timeout: "5s"
  drain_timeout: "30s"

  # Authentication
  auth:
    token: ""
    username: ""
    password: ""

  # TLS Configuration
  tls:
    enabled: false
    skip_verify: false

  # Middleware Configuration
  middleware:
    recovery:
      enabled: true
    
    metrics:
      enabled: true
    
    tracing:
      enabled: true
    
    logging:
      enabled: true
    
    circuit_breaker:
      enabled: true
      max_requests: 10
      interval: "60s"
      timeout: "10s"
      trip_threshold: 5
    
    retry:
      enabled: true
      max_attempts: 3
      initial_interval: "100ms"
      multiplier: 2.0
      max_interval: "2s"

# Telemetry Configuration
telemetry:
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
  
  tracing:
    enabled: true
    provider: "otlp"
    endpoint: "localhost:4317"
    sample_rate: 0.1

# Service-Specific Configuration
# Enable/disable event publishing to NATS
enable_event_publishing: true

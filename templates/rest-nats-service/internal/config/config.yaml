# REST-NATS Service Configuration (NATS + REST)

app:
  name: "rest-nats-service"
  version: "1.0.0"
  environment: "development"

# Logging Configuration
logging:
  level: "info"
  encoding: "json"
  output_paths:
    - "stdout"
  error_output_paths:
    - "stderr"

# Web Server Configuration
web:
  enabled: true
  host: "0.0.0.0"
  port: 8081
  read_timeout: "15s"
  write_timeout: "15s"
  idle_timeout: "60s"
  shutdown_timeout: "30s"
  
  cors:
    enabled: true
    allow_origins: ["*"]
    allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allow_headers: ["*"]
    expose_headers: ["Content-Length"]
    allow_credentials: true
    max_age: 3600

# NATS Configuration
nats:
  enabled: true
  url: "nats://localhost:4222"
  max_reconnects: 10
  reconnect_wait: "2s"
  connection_timeout: "5s"
  drain_timeout: "30s"
  
  auth:
    enabled: false
    token: ""
    username: ""
    password: ""
    creds_file: ""
  
  tls:
    enabled: false
    skip_verify: false
    ca_file: ""
    cert_file: ""
    key_file: ""
  
  middleware:
    recovery:
      enabled: true
    metrics:
      enabled: true
      path: "/metrics"
    tracing:
      enabled: true
    logging:
      enabled: true
    circuit_breaker:
      enabled: true
      max_requests: 10
      interval: "60s"
      timeout: "10s"
      trip_threshold: 5
    retry:
      enabled: true
      max_attempts: 3
      initial_interval: "100ms"
      multiplier: 2.0
      max_interval: "2s"
    timeout:
      enabled: true
      default: "5s"
    rate_limit:
      enabled: true
      requests_per_second: 100
      burst: 200

# Service Configuration
services:
  api:
    enabled: true
    enable_event_publishing: true  # Publish REST events to NATS

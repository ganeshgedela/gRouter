# Messaging + RPC Service Configuration

app:
  name: "nats-grpc-service"
  version: "1.0.0"
  environment: "development"

# Logging Configuration
logging:
  level: "info"
  encoding: "json"
  output_paths:
    - "stdout"
  error_output_paths:
    - "stderr"

# gRPC Server Configuration
grpc:
  enabled: true
  port: 9091
  max_connection_idle: "5m"
  max_connection_age: "10m"
  max_connection_age_grace: "5s"
  keepalive_time: "2h"
  keepalive_timeout: "20s"
  
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""
  
  reflection_enabled: false

# NATS Configuration
nats:
  enabled: true
  url: "nats://localhost:4222"
  max_reconnects: 10
  reconnect_wait: "2s"
  connection_timeout: "5s"
  drain_timeout: "30s"
  
  auth:
    token: ""
    username: ""
    password: ""
  
  tls:
    enabled: false
  
  middleware:
    recovery:
      enabled: true
    logging:
      enabled: true
    retry:
      enabled: true
      max_attempts: 3

# Service Configuration
services:
  message_handler:
    enabled: true
    topics:
      - "events.>"
      - "commands.>"

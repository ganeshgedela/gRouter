# gRPC Service Configuration

app:
  name: "grpc-service"
  version: "1.0.0"
  environment: "development"

# Logging Configuration
logging:
  level: "info"
  encoding: "json"
  output_paths:
    - "stdout"
  error_output_paths:
    - "stderr"

# gRPC Server Configuration
grpc:
  enabled: true
  port: 9090
  max_connection_idle: "5m"
  max_connection_age: "10m"
  max_connection_age_grace: "5s"
  keepalive_time: "2h"
  keepalive_timeout: "20s"
  keepalive_enforcement_min_time: "5m"
  keepalive_enforcement_permit_without_stream: true
  
  # TLS Configuration
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""
  
  # Reflection (disabled to avoid Bazel dependency)
  reflection_enabled: false
